name: API Tests - CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Execução diária às 6h (regressão completa)
    - cron: '0 6 * * *'

jobs:
  api-tests:
    name: Run API Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: servetest_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: ☕ Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 🗄️ Inicializar banco de dados
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d servetest_db -f docker/init.sql

      - name: 🧪 Executar testes
        env:
          BASE_URL: https://serverest.dev
          DB_URL: jdbc:postgresql://localhost:5432/servetest_db
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: mvn clean test -Dbase.url=$BASE_URL

      - name: 📊 Gerar relatório Allure
        if: always()
        run: mvn allure:report

      - name: 📤 Upload dos resultados Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results/
          retention-days: 30

      - name: 🌐 Deploy do relatório no GitHub Pages
        if: github.ref == 'refs/heads/main' && always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/site/allure-maven-plugin

      - name: ✅ Resumo da execução
        if: always()
        run: |
          echo "## 🧪 Resultado dos Testes" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Disparado por | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
